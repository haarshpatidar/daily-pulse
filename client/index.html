<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daily Pulse — your weather, news, and jobs in one glance." />
    <title>Daily Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        var saved = JSON.parse(localStorage.getItem("daily-pulse-prefs"));
        if (saved && saved.state && saved.state.theme) {
          document.documentElement.dataset.theme = saved.state.theme;
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
